name: Build and Publish Python Wheels
on:
  push:
    paths:
      - 'Cargo.toml'
  workflow_dispatch:

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      should_publish: ${{ steps.check_pypi.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v6
      - name: Extract version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep -m 1 "version" Cargo.toml | cut -d '"' -f 2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $VERSION"
      - name: Check if version exists on PyPI
        id: check_pypi
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pypi.org/pypi/sheetio/${{ steps.get_version.outputs.version }}/json")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Version ${{ steps.get_version.outputs.version }} already on PyPI"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version ${{ steps.get_version.outputs.version }} not on PyPI"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

  ci-gate:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: lewagon/wait-on-check-action@v1.6.0
        with:
          ref: ${{ github.sha }}
          check-regexp: ^(Rust checks|Python checks|Tests)
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

  build:
    name: Build wheels on ${{ matrix.os }}
    needs: [version, ci-gate]
    if: needs.version.outputs.should_publish == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: pip install maturin
      - name: Build wheels
        run: |
          if (!(Test-Path -Path "wheels")) { New-Item -ItemType Directory -Path "wheels" }
          maturin build --release --target ${{ matrix.target }} --out wheels
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: wheels/*.whl

  publish:
    name: Publish to PyPI
    needs: [version, build]
    if: needs.version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
      - name: Extract changelog for release
        id: changelog
        run: |
          VERSION=${{ needs.version.outputs.version }}
          BODY=$(sed -n "/^## \[$VERSION\]/,/^## \[/{ /^## \[$VERSION\]/d; /^## \[/d; p; }" CHANGELOG.md)
          echo "body<<CHANGELOG_EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "CHANGELOG_EOF" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          body: ${{ steps.changelog.outputs.body }}
          tag_name: v${{ needs.version.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
